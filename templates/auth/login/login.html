<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AIDISIGHT — intelligent insights through a clean, modern digital platform.">
  <title>AIDISIGHT — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/login/login.css">
</head>

<body class="auth-page">
  <div class="auth-orb orb-a"></div><div class="auth-orb orb-b"></div><div class="auth-orb orb-c"></div>
  <a class="back-home" href="../index/index.html">← Back to Home</a>
  <main class="auth-shell">
    <section class="glass-card">
      <a class="auth-brand" href="../index/index.html"><span class="brand-mark">A</span><span>AIDISIGHT</span></a>
      <div class="auth-header"><span class="auth-kicker">SECURE ACCESS</span><h1>Welcome back.</h1><p>Sign in to continue to your AIDISIGHT workspace.</p></div>
      <form id="loginForm" novalidate>
        <div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email" required><small class="field-error"></small></div>
        <div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required minlength="6"><button class="eye-btn" type="button" data-target="password" aria-label="Show password">◉</button></div><small class="field-error"></small></div>
        <div class="form-row"><label class="check"><input type="checkbox" id="remember"> <span>Remember me</span></label><a href="#" id="forgotLink">Forgot password?</a></div>
        <button class="submit-btn" type="submit">Sign in <span>→</span></button>
        <p class="form-status" id="formStatus" role="status"></p>
      </form>
      <div class="auth-switch">Don't have an account? <a href="../register/register.html">Create one</a></div>
    </section>
  </main>
  <script src="../../js/login/login.js"></script>
</body>
</html>
