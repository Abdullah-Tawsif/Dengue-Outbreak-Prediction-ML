[project]
name = "dengue-outbreak-prediction-ml"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "catboost==1.2.10",
    "email-validator==2.4.0",
    "fastapi==0.165.0",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "joblib==1.6.0",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "psycopg2-binary==2.9.13",
    "pwdlib[argon2]==0.4.2",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.34",
    "scipy==1.18.1",
    "sqlalchemy==2.1.9",
]

[project.optional-dependencies]
phase2 = ["scikit-learn==1.9.1"]

[tool.uv]
package = false
exclude-dependencies = [
    { package = { name = "catboost", version = "1.2.10" }, dependencies = ["graphviz", "matplotlib", "plotly"] },
]
